services:
  - type: web
    name: thickener-digital-twin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.data_generator && python -m backend.data_audit
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
