# Thickener Digital Twin — Explicit Parameter Register & Configuration
# IMPORTANT: No measured Project 4 plant dataset was supplied.
# All parameters below marked SYNTHETIC_ASSUMED are configurable engineering defaults
# for development and must be calibrated against plant / batch-settling data before plant use.

metadata:
  project_name: "Thickener Digital Twin"
  source_reference: "Simulation and AI Modeling Projects for Mineral Processing — Project 4 (§5.6, §5.8)"
  data_status: "SYNTHETIC_UNVALIDATED"
  disclaimer: "SYNTHETIC DATA & ASSUMED PARAMETERS: Not calibrated to measured plant data."

reference_ranges:
  feed_solids_wt_pct:
    min: 4.0
    max: 15.0
    unit: "% w/w"
    status: "SOURCE_INDICATIVE_RANGE"
    description: "Typical iron-ore tailings feed solids concentration range from Project 4 brief."
  flocculant_dose_gpt:
    min: 10.0
    max: 40.0
    unit: "g/t"
    status: "SOURCE_INDICATIVE_RANGE"
    description: "Typical flocculant dosage range per dry tonne of solids from Project 4 brief."
  underflow_solids_wt_pct:
    min: 55.0
    max: 70.0
    unit: "% w/w"
    status: "SOURCE_INDICATIVE_RANGE"
    description: "Typical underflow solids concentration range from Project 4 brief."

physical_constants:
  solids_density_kg_m3:
    value: 3200.0
    unit: "kg/m3"
    status: "SYNTHETIC_ASSUMED"
    description: "Assumed dry solids particle density (typical iron-ore tailings)."
  liquid_density_kg_m3:
    value: 1000.0
    unit: "kg/m3"
    status: "SYNTHETIC_ASSUMED"
